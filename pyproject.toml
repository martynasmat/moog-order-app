[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moog-order-app"
version = "0.1.0"
description = "Parse order requests for Outlook email retrieval."
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5,<4", "pywin32; sys_platform == 'win32'"]

[tool.setuptools]
py-modules = ["outlook_fetcher"]

[tool.setuptools.packages.find]
include = ["xlsx_parser*"]
